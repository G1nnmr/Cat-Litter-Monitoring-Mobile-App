name: cat_litter_monitoring_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_charts: ^29.2.7
  provider: ^6.1.3
  font_awesome_flutter: ^10.2.0
  flutter_screenutil: ^5.0.0
  liquid_progress_indicator_v2: ^0.5.0
  google_fonts: ^6.2.1
  lottie: ^3.0.0
  http: 1.4.0
  shelf: ^1.4.0
  shelf_router: ^1.1.3
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.3

analyzer:
  errors:
    unused_import: ignore
    dead_code: ignore

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/cat_logo.png
    - assets/images/paw_bg.png
    - assets/animations/cat_welcome.json
    - assets/animations/cat_hello.json
    - assets/animations/pawprints.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"  



